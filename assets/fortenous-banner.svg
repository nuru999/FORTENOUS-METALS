<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Fortenous Metals Tanzania Company Limited</title>
  <desc id="desc">Corporate website banner for Fortenous Metals</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070707"/>
      <stop offset=".58" stop-color="#17130C"/>
      <stop offset="1" stop-color="#3A2A0C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8860B"/>
      <stop offset=".5" stop-color="#F4D06F"/>
      <stop offset="1" stop-color="#D4A72C"/>
    </linearGradient>
    <pattern id="lines" width="52" height="52" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0V52" stroke="#FFFFFF" stroke-opacity=".025"/>
    </pattern>
    <filter id="shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity=".5"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#lines)"/>
  <circle cx="1080" cy="60" r="190" fill="#D4A72C" opacity=".055"/>
  <circle cx="1050" cy="345" r="240" fill="#F4D06F" opacity=".035"/>

  <g transform="translate(80 80)">
    <path d="M0 157 78 0l78 157h-42L78 79l-37 78Z" fill="url(#gold)" opacity=".95"/>
    <path d="m42 157 36-72 36 72Z" fill="#0B0B0B"/>
    <rect x="61" y="130" width="34" height="27" fill="url(#gold)"/>
  </g>

  <text x="280" y="105" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#D4A72C">FORTENOUS</text>
  <text x="280" y="168" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="800" fill="#FFFFFF">Metals Tanzania</text>
  <text x="280" y="211" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" fill="#D6D3D1">Corporate website for mining, metals and industrial enterprise.</text>

  <g transform="translate(280 255)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#F5F5F4">
    <rect width="116" height="40" rx="20" fill="#FFFFFF" opacity=".08"/>
    <circle cx="23" cy="20" r="5" fill="#D4A72C"/>
    <text x="39" y="26">Responsive</text>
    <g transform="translate(128)">
      <rect width="126" height="40" rx="20" fill="#FFFFFF" opacity=".08"/>
      <circle cx="23" cy="20" r="5" fill="#E5C158"/>
      <text x="39" y="26">Accessible</text>
    </g>
    <g transform="translate(266)">
      <rect width="150" height="40" rx="20" fill="#FFFFFF" opacity=".08"/>
      <circle cx="23" cy="20" r="5" fill="#F4D06F"/>
      <text x="39" y="26">Business-ready</text>
    </g>
  </g>

  <g transform="translate(930 92)" filter="url(#shadow)">
    <rect width="190" height="180" rx="22" fill="#111111" stroke="#D4A72C" stroke-opacity=".35"/>
    <rect x="22" y="22" width="146" height="16" rx="8" fill="#3F3F46"/>
    <path d="M29 126 61 88l24 20 33-50 43 68Z" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="22" y="145" width="92" height="12" rx="6" fill="#3F3F46"/>
  </g>
</svg>